name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build NeratPay APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug & Release APK
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Prepare APKs
        run: |
          mkdir -p output
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk output/NeratPay-release-unsigned.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output/NeratPay.apk
          fi
          ls -la output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeratPay-Android-App
          path: output/NeratPay.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: NeratPay Merchant App v1.0.0 (Build ${{ github.run_number }})
          body: |
            ### NeratPay Merchant Android App
            - Android WebView wrapper for https://dashboard.nerat.app
            - Full file upload support (Camera & Documents for KYB)
            - Native file downloads (PDF statements, CSVs, receipts)
            - Pull to refresh
            - Offline detection with auto-recovery
          files: output/NeratPay.apk
